<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход оператора - HelpDesk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="{{ url_for('static', filename='images/logo2.png') }}" alt="HelpDesk" class="login-logo">
                <h1 class="logo-text">HelpDesk</h1>
                <p class="login-subtitle">Панель оператора</p>
            </div>
            
            {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" class="login-form">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label for="operator_type">Тип оператора</label>
                    <select id="operator_type" name="operator_type" required>
                        <option value="">Выберите тип оператора</option>
                        <option value="it_help_desk">IT Help Desk</option>
                        <option value="retail_help_desk">Retail Help Desk</option>
                        <option value="medical_help_desk">Medical Help Desk</option>
                        <option value="legal_help_desk">Legal Help Desk</option>
                        <option value="telecom_help_desk">Telecom Help Desk</option>
                        <option value="auto_help_desk">Auto Help Desk</option>
                        <option value="general_help_desk">General Help Desk</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">Войти как оператор</button>
            </form>
            
            <div class="login-info">
                <p><strong>Учетные данные оператора:</strong></p>
                <p>Логин: admin / Пароль: admin123</p>
            </div>
        </div>
    </div>
</body>
</html>
