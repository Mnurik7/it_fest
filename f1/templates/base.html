<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Казахтелеком - Личный кабинет{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <svg width="180" height="40" viewBox="0 0 180 40" fill="none">
                        <text x="10" y="28" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0066CC">Казахтелеком</text>
                    </svg>
                </div>
                {% if session.client_id %}
                <nav class="nav">
                    <a href="{{ url_for('dashboard') }}" class="nav-link">Главная</a>
                    <a href="{{ url_for('tickets') }}" class="nav-link">Мои обращения</a>
                    <a href="{{ url_for('logout') }}" class="nav-link">Выход</a>
                </nav>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 АО «Казахтелеком». Все права защищены.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
